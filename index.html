function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  function fetchChannelDeep(handle, depth) {
    return fetchChannel(handle).then(function (first) {
      let allPosts = first.posts.slice();
      let oldest = first.oldestId;
      let chain = Promise.resolve();
      for (let i = 1; i < depth; i++) {
        chain = chain.then(function () {
          if (oldest == null) return;
          return fetchChannel(handle, { before: oldest }).then(function (data) {
            allPosts = allPosts.concat(data.posts);
            oldest = data.oldestId;
          });
        });
      }
      return chain.then(function () {
        return { posts: allPosts, oldestId: oldest };
      });
    });
  }


function isRtl(text) {
  return !!text && /[\u0590-\u05FF\u0600-\u06FF]/.test(text);
}

function timeAgo(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return mins + "m";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h";
  return Math.floor(hrs / 24) + "d";
}
function fontSizeForText(text) {
  const len = text ? text.length : 0;
  if (len > 600) return 14;
  if (len > 450) return 16;
  if (len > 320) return 18;
  if (len > 200) return 21;
  if (len > 120) return 24;
  return 28;
}

function wordCount(text) {
  return text ? text.trim().split(/\s+/).filter(Boolean).length : 0;
}
function passesWordFilter(post) {
  const text = post.text || post.caption || "";
  if (!text) return true;
  return wordCount(text) > 4;
}

function getFavorites() {

}
function isFavorited(key) {
  return getFavorites().some(function (f) { return f.key === key; });
}
function toggleFavoriteStorage(key, post, channel) {
  const favs = getFavorites();
  const idx = favs.findIndex(function (f) { return f.key === key; });
  if (idx !== -1) {
    favs.splice(idx, 1);
  } else {
    favs.unshift({ key: key, post: post, channel: channel, savedAt: Date.now() });
  }
  try { localStorage.setItem("favoritePosts", JSON.stringify(favs)); } catch (e) {}
  return favs;
}

async function fetchChannel(handle, params) {
  params = params || {};
  const url = new URL(API_BASE + "/api/channel");
  url.searchParams.set("name", handle);
  Object.keys(params).forEach((k) => {
    if (params[k] != null) url.searchParams.set(k, params[k]);
  });
  const res = await fetch(url);
  if (!res.ok) throw new Error("API error " + res.status);
  return res.json();
}

function TasbihCounter() {
  const [count, setCount] = useState(function () {
    try {
      const saved = JSON.parse(localStorage.getItem("tasbihCount") || "null");
      return typeof saved === "number" ? saved : 0;
    } catch (e) { return 0; }
  });
  const [locked, setLocked] = useState(false);
  const [routine, setRoutine] = useState(function () {
    try {
      const saved = JSON.parse(localStorage.getItem("tasbihRoutine") || "null");
      return Array.isArray(saved) ? saved : [];
    } catch (e) { return []; }
  });
  const [activeId, setActiveId] = useState(null);
  const [showManager, setShowManager] = useState(false);
  const [celebrate, setCelebrate] = useState(false);
  const [theme, setTheme] = useState(function () {
    try { return localStorage.getItem("tasbihTheme") || "beads"; } catch (e) { return "beads"; }
  });
  const [pellets] = useState(function () {
    const pool = ["🌳", "🌱", "🍃", "✨", "🌿", "🌾"];
    return Array.from({ length: 33 }, function () { return pool[Math.floor(Math.random() * pool.length)]; });
  });

  function toggleTheme(e) {
    if (e) e.stopPropagation();
    const next = theme === "beads" ? "pacman" : "beads";
    setTheme(next);
    try { localStorage.setItem("tasbihTheme", next); } catch (e) {}
  }

  function persistRoutine(next) {
    setRoutine(next);
    try { localStorage.setItem("tasbihRoutine", JSON.stringify(next)); } catch (e) {}
  }

  useEffect(function () {
    if (routine.length === 0) { setActiveId(null); return; }
    const current = routine.find(function (it) { return it.id === activeId; });
    if (!current) {
      const firstIncomplete = routine.find(function (it) { return it.count < it.target; });
      setActiveId(firstIncomplete ? firstIncomplete.id : routine[0].id);
    }
  }, [routine]);

  function playChime100() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [660, 880].forEach(function (freq, i) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + i * 0.15);
        gain.gain.linearRampToValueAtTime(0.3, now + i * 0.15 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.4);
      });
    } catch (e) {}
  }

  function playChime33() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 1046;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.25, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } catch (e) {}
  }

  function incrementGeneric() {
    if (navigator.vibrate) navigator.vibrate(10);
    setCount(function (prev) {
      const next = prev + 1;
      try { localStorage.setItem("tasbihCount", JSON.stringify(next)); } catch (e) {}
      if (next % 100 === 0) {
        playChime100();
        setCelebrate(true);
        setTimeout(function () { setCelebrate(false); }, 1300);
      } else if (next % 33 === 0) {
        playChime33();
      }
      return next;
    });
  }

  function incrementActiveItem() {
    if (navigator.vibrate) navigator.vibrate(10);
    const next = routine.map(function (it) {
      if (it.id !== activeId) return it;
      const newCount = it.count + 1;
      if (newCount === it.target) {
        playChime33();
        if (navigator.vibrate) navigator.vibrate([10, 40, 10]);
      }
      return Object.assign({}, it, { count: newCount });
    });
    persistRoutine(next);
    const justUpdated = next.find(function (it) { return it.id === activeId; });
    if (justUpdated && justUpdated.count >= justUpdated.target) {
      const nextIncomplete = next.find(function (it) { return it.count < it.target; });
      if (nextIncomplete) setActiveId(nextIncomplete.id);
    }
  }

  function handleTap() {
    if (routine.length > 0 && activeId != null) {
      incrementActiveItem();
    } else {
      incrementGeneric();
    }
  }

  function handleReset(e) {
    if (e) e.stopPropagation();
    if (routine.length > 0 && activeId != null) {
      const next = routine.map(function (it) { return it.id === activeId ? Object.assign({}, it, { count: 0 }) : it; });
      persistRoutine(next);
    } else {
      setCount(0);
      try { localStorage.setItem("tasbihCount", JSON.stringify(0)); } catch (e) {}
    }
  }

      function renderBeads() {
    let target = 33, current = 0;
    if (routine.length > 0 && activeId != null) {
      const active = routine.find(function (it) { return it.id === activeId; });
      if (active) { target = active.target; current = Math.min(active.count, active.target); }
    } else {
      current = count % 33 === 0 && count > 0 ? 33 : count % 33;
    }
    const filled = target > 0 ? Math.round((current / target) * 33) : 0;
    const beads = [];
    for (let i = 0; i < 33; i++) {
      const angle = (i / 33) * 2 * Math.PI - Math.PI / 2;
      const x = 50 + 44 * Math.cos(angle);
      const y = 50 + 44 * Math.sin(angle);

  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  const loadInitial = useCallback(function () {
    setStatus("loading");
           const depth = sources.length > 1 ? Math.max(3, Math.round(12 / sources.length)) : 6;

        results.forEach(function (data, i) {
          const src = sources[i];
          const tagged = tagPosts(data.posts, src).filter(passesWordFilter);
          merged = merged.concat(tagged);
          newestIdRef.current[src.handle] = tagged[0] ? tagged[0].id : null;
          oldestIdRef.current[src.handle] = data.oldestId;
        });
                merged = (sources.length === 1 && sources[0].ordered)
          ? merged.slice().sort(function (a, b) { return a.id - b.id; })

          setPosts(function (prev) { return older.concat(prev); });
        } else {

  }, [channel]);

    status === "error" &&
      h("div", { className: "w-full h-full flex flex-col items-center justify-center gap-3 px-8", style: { background: "#0B0E11" } },
        h("span", { className: "text-[13px] font-mono text-[#6B7480] text-center" }, "Couldn't reach the backend. Check the connection and try again."),
        h("button", { onClick: loadInitial, className: "text-[12px] px-3 py-1.5 rounded-full", style: { background: "#151A21", color: "#4AF6C3" } }, "Retry")),
        status === "ready" &&
      h("div", { ref: containerRef, onScroll: handleScroll, className: "w-full h-full overflow-y-scroll", style: { scrollSnapType: "y mandatory" } },
        posts.map(function (p, i) {
          const key = p.__key || p.id;
          if (i >= currentIndex - 1 && i <= currentIndex + 3) {
            return h(Slide, { key: key, post: p, channel: p.__src || channel });
          }
          return h("div", { key: key, className: "w-full h-full flex-shrink-0", style: { scrollSnapAlign: "start", background: "#0B0E11" } });
        }))

  );
}

  function MixPicker(props) {
  const initial = props.initial, onSave = props.onSave, onClose = props.onClose;
  const options = CHANNELS.filter(function (c) { return !c.mix; });
    const [checked, setChecked] = useState(function () {
    return initial && initial.length ? initial : [];
  });


  function toggle(id) {
    setChecked(function (prev) {
      return prev.indexOf(id) !== -1 ? prev.filter(function (x) { return x !== id; }) : prev.concat([id]);
    });
  }

  return h(
    "div",
    { className: "fixed inset-0 z-30 flex items-end justify-center", style: { background: "rgba(0,0,0,0.6)" } },
    h(
      "div",
      { className: "w-full max-w-md rounded-t-3xl flex flex-col", style: { background: "#151A21", maxHeight: "80vh" } },
      h(
        "div",
        { className: "px-5 pt-5 pb-3 flex-1 overflow-y-auto" },
        h("h2", { className: "text-lg font-semibold text-white mb-4 text-right", dir: "rtl" }, "اختر قنواتك المفضلة"),
        options.map(function (ch) {
          const isOn = checked.indexOf(ch.id) !== -1;
          return h("button", {
            key: ch.id,
            onClick: function () { toggle(ch.id); },
            className: "w-full flex items-center justify-between gap-3 px-3 py-3 rounded-2xl mb-2",
            style: { background: isOn ? ch.color + "22" : "rgba(255,255,255,0.04)" }
          },
            h("div", { className: "flex items-center gap-3" },
              h("div", { className: "w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-mono text-xs",
                style: { background: ch.color + "33", color: ch.color } }, ch.freq),
              h("span", { className: "text-[14px] text-white", dir: "rtl" }, ch.name)
            ),
            h("div", { className: "w-5 h-5 rounded-full flex items-center justify-center", style: { background: isOn ? "#4AF6C3" : "rgba(255,255,255,0.15)" } },
              isOn && h("span", { style: { color: "#000", fontSize: "12px" } }, "✓"))
          );
        })
      ),
      h(
        "div",
        { className: "flex gap-3 px-5 pt-3 pb-6", style: { borderTop: "1px solid rgba(255,255,255,0.08)" } },
        h("button", { onClick: onClose, className: "flex-1 py-3 rounded-2xl text-white/70", style: { background: "rgba(255,255,255,0.06)" } }, "إلغاء"),
        h("button", { onClick: function () { onSave(checked); }, className: "flex-1 py-3 rounded-2xl text-black font-semibold", style: { background: "#4AF6C3" } }, "حفظ")
      )
    )
  );
}




function ChannelList(props) {
  const onSelect = props.onSelect;
  const [videoUrl, setVideoUrl] = useState(null);
    const [shuffledChannels] = useState(function () {
    const first = CHANNELS[0];
    const second = CHANNELS.filter(function (c) { return c.id === "muslim_tok_s"; })[0];
    const rest = shuffleArray(CHANNELS.filter(function (c) { return c.id !== "mix" && c.id !== "muslim_tok_s"; }));
    return [first, second, FAVORITES_CHANNEL].concat(rest);
  });

    const videoRef = useRef(null);
  const [showPicker, setShowPicker] = useState(false);
    const [customIds, setCustomIds] = useState(function () {
    try {
      const saved = localStorage.getItem("mixCustomIds");
      return saved ? JSON.parse(saved) : [];
    } catch (e) { return []; }
  });
  const [hasCustomized, setHasCustomized] = useState(function () {
    try { return localStorage.getItem("mixCustomIds") !== null; } catch (e) { return false; }
  });


        function saveCustom(ids) {
    setCustomIds(ids);
    setHasCustomized(true);
    try { localStorage.setItem("mixCustomIds", JSON.stringify(ids)); } catch (e) {}
    setShowPicker(false);
    const mixChannel = CHANNELS.filter(function (c) { return c.mix; })[0];
    onSelect(Object.assign({}, mixChannel, { customIds: ids }));
  }



  function handleSelect(ch) {
    if (ch.favorites) {
      onSelect(ch);
      return;
    }
    if (ch.mix) {
      if (!hasCustomized) {
        setShowPicker(true);
      } else {
        onSelect(Object.assign({}, ch, { customIds: customIds }));
      }
    } else {
      onSelect(ch);
    }
  }


  useEffect(function () {
    fetch(API_BASE + "/api/nature-video")

      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.url) setVideoUrl(d.url); })
      .catch(function () {});
  }, []);

    useEffect(function () {
    const v = videoRef.current;
    if (!v || !videoUrl) return;
    v.muted = true;
    v.playbackRate = 0.5;
    v.play().catch(function () {});
  }, [videoUrl]);



  return h(
    "div",
    { className: "relative flex flex-col h-full overflow-hidden", style: { background: "#0B0E11" } },
    videoUrl && h("video", {
      ref: videoRef, src: videoUrl, autoPlay: true, muted: true, loop: true, playsInline: true,
      className: "absolute inset-0 w-full h-full object-cover",
    }),

    h("div", { className: "absolute inset-0", style: { background: "linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.75) 100%)" } }),

        h("div", { className: "relative px-5 pb-4 text-center", style: { paddingTop: "calc(env(safe-area-inset-top, 0px) + 24px)" } },
  h("div", { className: "inline-block backdrop-blur-md rounded-2xl px-4 py-3", style: { background: "rgba(0,0,0,0.32)" } },
        h("div", { className: "flex items-center gap-2 text-[#4AF6C3] mb-1" },
          h("span", { className: "text-[11px] font-mono tracking-widest uppercase" }, "developed by: Abu Sanad  ")),
        h("h1", { className: "text-2xl font-semibold text-white tracking-tight" }, "✨نفائس الكلم"),
        h("p", { className: "text-sm text-white/70 mt-1" }, " نُثمِّن وقتك 🕌")
      )
    ),

        h("div", { className: "relative flex-1 overflow-y-auto px-4 pb-4 space-y-4" },
      shuffledChannels.map(function (ch) {
               return h("div", { key: ch.id, className: "flex items-center gap-2" },
                    h("button", { onClick: function () { handleSelect(ch); },
            className: "inline-flex items-center gap-3 pl-2 pr-5 py-2 rounded-full backdrop-blur-sm active:opacity-80 transition-opacity text-left",
            style: { background: "rgba(0,0,0,0.4)" } },
            h("div", { className: "w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 font-mono text-xs font-semibold",
              style: { background: ch.color + "33", color: ch.color } }, ch.freq),
            h("div", { className: "min-w-0" },
              h("span", { className: "text-[15px] font-medium text-white truncate block", style: { textShadow: "0 1px 4px rgba(0,0,0,0.8)" } }, ch.name),
              h("span", { className: "text-[12px] text-white/60" }, "@" + (ch.handle || "null")))
          ),
                    ch.mix && h("button", { onClick: function () { setShowPicker(true); }, className: "p-2 rounded-full text-white/70 flex-shrink-0 pulse-gear", style: { background: "rgba(0,0,0,0.4)" } }, "🔘اصنع مفضلتك هنا🔀")
        );
      })
    ),



        h("div", { className: "relative mx-3 mb-4 px-4 py-3 rounded-2xl backdrop-blur-md", style: { background: "rgba(0,0,0,0.35)" } },
  h("p", { className: "text-[9px] text-white/70 leading-relaxed" },
    "(للتواصل: https://t.me/Abdulrahman_GA ) 🤲🏽اشملونا ووالدينا في صالح دعائكم")
),
    showPicker && h(MixPicker, { initial: customIds, onSave: saveCustom, onClose: function () { setShowPicker(false); } })

  );
}



function App() {
  const [active, setActive] = useState(null);
  const [rainOn, setRainOn] = useState(false);
  const [wavesOn, setWavesOn] = useState(false);
  const [fireOn, setFireOn] = useState(false);
  const rainRef = useRef(null);
  const wavesRef = useRef(null);
  const fireRef = useRef(null);

    function toggleLoopSound(ref, url, on, setOn) {
    if (!ref.current) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const gain = ctx.createGain();
      gain.gain.value = 0;
      gain.connect(ctx.destination);
      const state = { ctx: ctx, gain: gain, ready: false, wantsOn: false };
      ref.current = state;
      fetch(url)
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (buf) { return ctx.decodeAudioData(buf); })
        .then(function (audioBuffer) {
          const source = ctx.createBufferSource();
          source.buffer = audioBuffer;
          source.loop = true;
          source.connect(gain);
          source.start();
          state.ready = true;
          if (state.wantsOn) {
            gain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.8);
          }
        });
    }
    const state = ref.current;
    if (state.ctx.state === "suspended") state.ctx.resume();
    const target = on ? 0 : 0.6;
    state.wantsOn = !on;
    if (state.ready) {
      state.gain.gain.cancelScheduledValues(state.ctx.currentTime);
      state.gain.gain.linearRampToValueAtTime(target, state.ctx.currentTime + 0.8);
    }
    setOn(!on);
  }

  const toggleFire = useCallback(function () {
    toggleLoopSound(fireRef, "/fire.m4a", fireOn, setFireOn);
  }, [fireOn]);

  const toggleWaves = useCallback(function () {
    toggleLoopSound(wavesRef, "/waves.m4a", wavesOn, setWavesOn);
  }, [wavesOn]);

  const toggleRain = useCallback(function () {
    toggleLoopSound(rainRef, "/Rain.m4a", rainOn, setRainOn);
  }, [rainOn]);



  return h(
    "div",
    { className: "w-full flex flex-col", style: { height: "100dvh", background: "#0B0E11", overflow: "hidden", position: "relative" } },
        h("button", { onClick: toggleRain, className: "absolute right-4 z-20 p-2 rounded-full bg-black/35 backdrop-blur-sm text-[16px]", style: { opacity: rainOn ? 1 : 0.6, top: "calc(env(safe-area-inset-top, 0px) + 12px)" } }, "🌧"),
    h("button", { onClick: toggleWaves, className: "absolute right-4 z-20 p-2 rounded-full bg-black/35 backdrop-blur-sm text-[16px]", style: { opacity: wavesOn ? 1 : 0.6, top: "calc(env(safe-area-inset-top, 0px) + 60px)" } }, "🌊"),
    h("button", { onClick: toggleFire, className: "absolute right-4 z-20 p-2 rounded-full bg-black/35 backdrop-blur-sm text-[16px]", style: { opacity: fireOn ? 1 : 0.6, top: "calc(env(safe-area-inset-top, 0px) + 108px)" } }, "🔥"),
    h(TasbihCounter),

    active ? h(Feed, { channel: active, onBack: function () { setActive(null); } }) : h(ChannelList, { onSelect: setActive })
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
