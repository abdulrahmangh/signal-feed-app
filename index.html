<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>نفائس الكلم 💡</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body, #root { height: 100%; margin: 0; background: #0B0E11; }
  ::-webkit-scrollbar { display: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  @keyframes kenburns {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.15) translate(-2%, -2%); }
}
.kenburns-img { animation: kenburns 20s ease-in-out infinite alternate; will-change: transform; }

</style>
</head>
<body>
<div id="root">
  <div style="color:#6B7480;font-family:monospace;font-size:13px;text-align:center;padding-top:50vh;">Loading…</div>
</div>
<script>
window.onerror = function (msg, url, line, col) {
  document.getElementById("root").innerHTML =
    '<pre style="color:#fff;padding:20px;font-size:11px;white-space:pre-wrap;">Error: ' +
    msg + "\nLine " + line + ":" + col + "</pre>";
};
</script>
<script>
const h = React.createElement;
const { useState, useEffect, useRef, useCallback } = React;

const API_BASE = "https://signal-feed-backend.vercel.app";
const POLL_INTERVAL_MS = 30000;

const CHANNELS = [
  { id: "mix", handle: null, name: "مزيج", freq: "🕌", color: "#FF6EC7", mix: true },
  { id: "alsakrandrr", handle: "Alsakrandrr", name: "درر الشيخ السكران", freq: "1", color: "#4AF6C3" },
  { id: "iilllii7", handle: "iilllii7", name: "فوائد ابن القيم", freq: "2", color: "#FFB86B" },
  { id: "ebn_taimia1", handle: "ebn_taimia1", name: "فوائد ابن تيمية", freq: "3", color: "#8AB4FF" },
  { id: "heeekma1", handle: "heeekma1", name: "آية وحكمة", freq: "4", color: "#9CFF6E" },
  { id: "athar_sahaba", handle: "athar_sahaba", name: "صحيح آثار الصحابة", freq: "5", color: "#E07856" },
  { id: "athar_tafser", handle: "athar_tafser", name: "أفلا يتدبرون القرآن", freq: "6", color: "#6EC79C" },
  { id: "athar_tabin", handle: "athar_tabin",  name: "صحيح آثار التابعين", freq: "7", color: "#C79C6E" },

];



function isRtl(text) {
  return !!text && /[\u0590-\u05FF\u0600-\u06FF]/.test(text);
}

function timeAgo(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return mins + "m";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h";
  return Math.floor(hrs / 24) + "d";
}
function fontSizeForText(text) {
  const len = text ? text.length : 0;
  if (len > 600) return 14;
  if (len > 450) return 16;
  if (len > 320) return 18;
  if (len > 200) return 21;
  if (len > 120) return 24;
  return 28;
}

async function fetchChannel(handle, params) {
  params = params || {};
  const url = new URL(API_BASE + "/api/channel");
  url.searchParams.set("name", handle);
  Object.keys(params).forEach((k) => {
    if (params[k] != null) url.searchParams.set(k, params[k]);
  });
  const res = await fetch(url);
  if (!res.ok) throw new Error("API error " + res.status);
  return res.json();
}

function IconArrowLeft() {
  return h(
    "svg",
    { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: "#fff", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    h("line", { x1: 19, y1: 12, x2: 5, y2: 12 }),
    h("polyline", { points: "12 19 5 12 12 5" })
  );
}
function IconRefresh({ spinning }) {
  return h(
    "svg",
    { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: "#fff", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round",
      style: spinning ? { animation: "spin 1s linear infinite" } : {} },
    h("polyline", { points: "23 4 23 10 17 10" }),
    h("polyline", { points: "1 20 1 14 7 14" }),
    h("path", { d: "M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" })
  );
}
function IconEye() {
  return h(
    "svg",
    { width: 11, height: 11, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    h("path", { d: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" }),
    h("circle", { cx: 12, cy: 12, r: 3 })
  );
}
  function IconChevron() {
  return h(
    "svg",
    { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: "#3A4048", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    h("polyline", { points: "9 18 15 12 9 6" })
  );
}

function IconRain(props) {
  const on = props.on;
  return h(
    "svg",
    { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: on ? "#4AF6C3" : "#fff", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    h("path", { d: "M8 13a5 5 0 0 1 10 0" }),
    h("line", { x1: 8, y1: 19, x2: 8, y2: 21 }),
    h("line", { x1: 12, y1: 19, x2: 12, y2: 22 }),
    h("line", { x1: 16, y1: 19, x2: 16, y2: 21 })
  );
}


function SlideChrome(props) {
  const post = props.post, channel = props.channel, light = props.light, rtlCaption = props.rtlCaption;
  const caption = post.caption;
  return h(
    React.Fragment,
    null,
    h(
      "div",
      { className: "absolute top-4 left-4 right-4 flex items-center gap-2" },
      h(
        "div",
        { className: "w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 font-mono text-[10px] font-semibold",
          style: { background: channel.color + "33", color: channel.color } },
        channel.freq
      ),
      h("span", { className: "text-[13px] font-medium text-white drop-shadow" }, channel.name)
    ),
    h(
      "div",
      { className: "absolute bottom-5 left-4 right-4" },
      caption &&
        h(
          "p",
          { className: "text-[20px] leading-snug font-medium mb-2 " + (light ? "text-white" : "text-[#E4E7EB]") + (rtlCaption ? " text-right" : ""),
            dir: rtlCaption ? "rtl" : "ltr",
            style: { textShadow: light ? "0 1px 8px rgba(0,0,0,0.7)" : "none" } },
          caption
        ),
      h(
        "div",
        { className: "flex items-center gap-3 text-[11px] font-mono " + (light ? "text-white/70" : "text-[#6B7480]") },
        post.views != null &&
          h("span", { className: "flex items-center gap-1" }, h(IconEye), " " + post.views.toLocaleString()),
        h("span", null, timeAgo(post.time) + " ago")
      )
    )
  );
}

function Slide(props) {
  const post = props.post, channel = props.channel;
  const rtlText = isRtl(post.text);
  const rtlCaption = isRtl(post.caption);

  if (post.type === "photo" && post.imageUrl) {
    return h(
      "div",
      { className: "relative w-full h-full flex-shrink-0 overflow-hidden", style: { scrollSnapAlign: "start" } },
      h("img", { src: post.imageUrl, alt: "", className: "absolute inset-0 w-full h-full object-contain kenburns-img", draggable: false }),
      h("div", { className: "absolute inset-0",
        style: { background: "linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.85) 100%)" } }),
      h(SlideChrome, { post: post, channel: channel, light: true, rtlCaption: rtlCaption })
    );
  }

    const [bgUrl, setBgUrl] = React.useState(null);
  React.useEffect(function () {
    fetch(API_BASE + "/api/nature")
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.url) setBgUrl(d.url); })
      .catch(function () {});
  }, [post.id]);

  return h(
    "div",
    { className: "relative w-full h-full flex-shrink-0 overflow-hidden flex items-center justify-center px-8",
      style: { scrollSnapAlign: "start", background: "#0B0E11" } },
    bgUrl && h("img", { src: bgUrl, alt: "", className: "absolute inset-0 w-full h-full object-cover kenburns-img", draggable: false }),
    h("div", { className: "absolute inset-0", style: { background: "linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.25) 45%, rgba(0,0,0,0.65) 100%)" } }),
    h("div", { className: "relative backdrop-blur-md rounded-3xl px-6 py-8", style: { background: "rgba(0,0,0,0.28)" } },
      h("p", { className: "leading-snug font-semibold text-center text-white", dir: rtlText ? "rtl" : "ltr", style: { maxWidth: 320, fontSize: fontSizeForText(post.text) + "px" } }, post.text)
    ),
    h(SlideChrome, { post: post, channel: channel, light: true, rtlCaption: rtlCaption })
  );
}

function Feed(props) {
  const channel = props.channel, onBack = props.onBack;
  const sources = channel.mix ? CHANNELS.filter(function (c) { return !c.mix; }) : [channel];
  const [posts, setPosts] = useState([]);
  const [status, setStatus] = useState("loading");
  const [refreshing, setRefreshing] = useState(false);
  const containerRef = useRef(null);
  const loadingMoreRef = useRef(false);
  const newestIdRef = useRef({});
  const oldestIdRef = useRef({});

  function tagPosts(list, src) {
    return list.map(function (p) { return Object.assign({}, p, { __src: src, __key: src.handle + "-" + p.id }); });
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  const loadInitial = useCallback(function () {
    setStatus("loading");
    Promise.all(sources.map(function (src) { return fetchChannel(src.handle); }))
      .then(function (results) {
        let merged = [];
        results.forEach(function (data, i) {
          const src = sources[i];
          const tagged = tagPosts(data.posts, src);
          merged = merged.concat(tagged);
          newestIdRef.current[src.handle] = tagged[0] ? tagged[0].id : null;
          oldestIdRef.current[src.handle] = data.oldestId;
        });
        merged = shuffle(merged);
        setPosts(merged);
        setStatus("ready");
      })
      .catch(function () { setStatus("error"); });
  }, [channel]);

  const checkForNew = useCallback(function (manual) {
    if (manual) setRefreshing(true);
    Promise.all(sources.map(function (src) {
      return fetchChannel(src.handle, { sinceId: newestIdRef.current[src.handle] });
    }))
      .then(function (results) {
        let fresh = [];
        results.forEach(function (data, i) {
          const src = sources[i];
          if (data.posts.length) {
            const tagged = tagPosts(data.posts, src);
            fresh = fresh.concat(tagged);
            newestIdRef.current[src.handle] = tagged[0].id;
          }
        });
        if (fresh.length) {
          fresh = shuffle(fresh);
          setPosts(function (prev) { return fresh.concat(prev); });
        }
      })
      .catch(function () {})
      .finally(function () { if (manual) setRefreshing(false); });
  }, [channel]);

  const loadOlder = useCallback(function () {
    if (loadingMoreRef.current) return;
    loadingMoreRef.current = true;
    Promise.all(sources.map(function (src) {
      const before = oldestIdRef.current[src.handle];
      if (before == null) return Promise.resolve({ posts: [], oldestId: null });
      return fetchChannel(src.handle, { before: before });
    }))
      .then(function (results) {
        let older = [];
        results.forEach(function (data, i) {
          const src = sources[i];
          if (data.posts.length) {
            older = older.concat(tagPosts(data.posts, src));
            oldestIdRef.current[src.handle] = data.oldestId;
          } else {
            oldestIdRef.current[src.handle] = null;
          }
        });
        older = shuffle(older);
        setPosts(function (prev) { return prev.concat(older); });
      })
      .catch(function () {})
      .finally(function () { loadingMoreRef.current = false; });
  }, [channel]);

  useEffect(function () { loadInitial(); }, [loadInitial]);

  useEffect(function () {
    if (status !== "ready") return;
    const interval = setInterval(function () { checkForNew(false); }, POLL_INTERVAL_MS);
    return function () { clearInterval(interval); };
  }, [status, checkForNew]);

  const handleScroll = useCallback(function () {
    const el = containerRef.current;
    if (!el) return;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < el.clientHeight * 1.2) loadOlder();
  }, [loadOlder]);

  return h(
    "div",
    { className: "relative w-full h-full" },
    h("button", { onClick: onBack, className: "absolute top-4 left-4 z-10 p-2 rounded-full bg-black/35 backdrop-blur-sm" }, h(IconArrowLeft)),
    h("button", { onClick: function () { checkForNew(true); }, className: "absolute top-4 right-4 z-10 p-2 rounded-full bg-black/35 backdrop-blur-sm" },
      h(IconRefresh, { spinning: refreshing })),
    status === "loading" &&
      h("div", { className: "w-full h-full flex items-center justify-center", style: { background: "#0B0E11" } },
        h("span", { className: "text-[13px] font-mono text-[#6B7480]" }, "Loading…")),
    status === "error" &&
      h("div", { className: "w-full h-full flex flex-col items-center justify-center gap-3 px-8", style: { background: "#0B0E11" } },
        h("span", { className: "text-[13px] font-mono text-[#6B7480] text-center" }, "Couldn't reach the backend. Check the connection and try again."),
        h("button", { onClick: loadInitial, className: "text-[12px] px-3 py-1.5 rounded-full", style: { background: "#151A21", color: "#4AF6C3" } }, "Retry")),
    status === "ready" &&
      h("div", { ref: containerRef, onScroll: handleScroll, className: "w-full h-full overflow-y-scroll", style: { scrollSnapType: "y mandatory" } },
        posts.map(function (p) { return h(Slide, { key: p.__key || p.id, post: p, channel: p.__src || channel }); }))
  );
}


function ChannelList(props) {
  const onSelect = props.onSelect;
  const [videoUrl, setVideoUrl] = useState(null);
  const videoRef = useRef(null);

  useEffect(function () {
    fetch(API_BASE + "/api/nature-video")
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.url) setVideoUrl(d.url); })
      .catch(function () {});
  }, []);

  useEffect(function () {
    const v = videoRef.current;
    if (!v || !videoUrl) return;
    v.muted = true;
    v.play().catch(function () {});
  }, [videoUrl]);


  return h(
    "div",
    { className: "relative flex flex-col h-full overflow-hidden", style: { background: "#0B0E11" } },
    videoUrl && h("video", {
      ref: videoRef, src: videoUrl, autoPlay: true, muted: true, loop: true, playsInline: true,
      className: "absolute inset-0 w-full h-full object-cover",
    }),

    h("div", { className: "absolute inset-0", style: { background: "linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.75) 100%)" } }),

    h("div", { className: "relative px-5 pt-6 pb-4" },
      h("div", { className: "inline-block backdrop-blur-md rounded-2xl px-4 py-3", style: { background: "rgba(0,0,0,0.32)" } },
        h("div", { className: "flex items-center gap-2 text-[#4AF6C3] mb-1" },
          h("span", { className: "text-[11px] font-mono tracking-widest uppercase" }, "developed by: Abu Sanad")),
        h("h1", { className: "text-2xl font-semibold text-white tracking-tight" }, "💡نفائس الكلم"),
        h("p", { className: "text-sm text-white/70 mt-1" }, " نُثمِّن وقتك 🕌")
      )
    ),

        h("div", { className: "relative flex-1 overflow-y-auto px-4 pb-4 space-y-4" },
      CHANNELS.map(function (ch) {
        return h("button", { key: ch.id, onClick: function () { onSelect(ch); },
          className: "inline-flex items-center gap-3 pl-2 pr-5 py-2 rounded-full backdrop-blur-sm active:opacity-80 transition-opacity text-left",
          style: { background: "rgba(0,0,0,0.4)" } },
          h("div", { className: "w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 font-mono text-xs font-semibold",
            style: { background: ch.color + "33", color: ch.color } }, ch.freq),
          h("div", { className: "min-w-0" },
            h("span", { className: "text-[15px] font-medium text-white truncate block", style: { textShadow: "0 1px 4px rgba(0,0,0,0.8)" } }, ch.name),
            h("span", { className: "text-[12px] text-white/60" }, "@" + (ch.handle || "null")))
        );
      }).map(function (btn) { return h("div", { key: btn.key }, btn); })
    ),


    h("div", { className: "relative mx-3 mb-4 px-4 py-3 rounded-2xl backdrop-blur-md", style: { background: "rgba(0,0,0,0.35)" } },
      h("p", { className: "text-[12px] text-white/70 leading-relaxed" },
        "Updates automatically every " + (POLL_INTERVAL_MS / 1000) + "s, or tap refresh in a feed to check now.")
    )
  );
}


function App() {
  const [active, setActive] = useState(null);
  const [rainOn, setRainOn] = useState(false);
  const rainRef = useRef(null);

  const toggleRain = useCallback(function () {
    if (!rainRef.current) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = 2 * ctx.sampleRate;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;
      const highpass = ctx.createBiquadFilter();
      highpass.type = "highpass";
      highpass.frequency.value = 400;
      const bandpass = ctx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.value = 1000;
      bandpass.Q.value = 0.6;
      const gain = ctx.createGain();
      gain.gain.value = 0;
      noise.connect(highpass);
      highpass.connect(bandpass);
      bandpass.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
      rainRef.current = { ctx: ctx, gain: gain };
    }
    const r = rainRef.current;
    if (r.ctx.state === "suspended") r.ctx.resume();
    const target = rainOn ? 0 : 0.12;
    r.gain.gain.linearRampToValueAtTime(target, r.ctx.currentTime + 0.8);
    setRainOn(!rainOn);
  }, [rainOn]);

  return h(
    "div",
    { className: "w-full flex flex-col", style: { height: "100dvh", background: "#0B0E11", overflow: "hidden", position: "relative" } },
    h("button", { onClick: toggleRain, className: "absolute top-4 right-4 z-20 p-2 rounded-full bg-black/35 backdrop-blur-sm" }, h(IconRain, { on: rainOn })),
    active ? h(Feed, { channel: active, onBack: function () { setActive(null); } }) : h(ChannelList, { onSelect: setActive })
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
